name: Update Blocklist

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 2am UTC
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force fresh download (skip cache)'
        required: false
        type: boolean
        default: false
      skip_commit:
        description: 'Generate blocklist but skip commit (test mode)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-blocklist:
    runs-on: ubuntu-latest

    env:
      PF_PROVIDERS_CONF_URL: "https://raw.githubusercontent.com/nikescar/cdn-lookup/main/providers.conf"
      PF_PROVIDERS_CACHE_DAYS: "7"
      PF_PROVIDER_TIMEOUT: "30"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Create .env file
        run: |
          cat > .env <<EOF
          PF_ISP_INTERFACE="eth0"
          PF_LAN_INTERFACE="eth1"
          PF_LAN_ENABLED="0"
          PF_PROVIDERS_CONF_URL="${{ env.PF_PROVIDERS_CONF_URL }}"
          PF_PROVIDERS_CACHE_DAYS="${{ env.PF_PROVIDERS_CACHE_DAYS }}"
          PF_PROVIDER_TIMEOUT="${{ env.PF_PROVIDER_TIMEOUT }}"
          PF_OUTPUT_FILE="./pf.conf"
          EOF

      - name: Clear cache if force update
        if: github.event.inputs.force_update == 'true'
        run: |
          rm -f providers.conf
          rm -rf output/tables/
          echo "Cache cleared for force update"

      - name: Run pfhelper update
        run: |
          chmod +x ./pfhelper.sh
          ./pfhelper.sh --update || true

      - name: Check for changes
        id: git-check
        run: |
          git add -N output/
          git diff --exit-code output/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true' && github.event.inputs.skip_commit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "chore: update provider tables and blocklist (automated weekly update)"
          git push

      - name: Skip commit (test mode)
        if: steps.git-check.outputs.changed == 'true' && github.event.inputs.skip_commit == 'true'
        run: echo "Blocklist updated but commit skipped (test mode)"

      - name: No changes
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No changes to blocklist"
